[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_facts_check*"]

[project]
name = "rag-facts-check"
version = "0.2.0"
description = "Modular RAG answer fact-checking system using claim extraction + per-claim verification"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["ruff>=0.9.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt strings and mock responses are long by design
"rag_facts_check/prompts.py" = ["E501"]
"rag_facts_check/testing/mocks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
