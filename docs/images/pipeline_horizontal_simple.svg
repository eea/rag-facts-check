<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240">
  <defs>
    <filter id="shadow-h-simple" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
    <marker id="arrow-h-simple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="240" rx="16" fill="#f8fafc" />

  <!-- Flow connecting arrows -->
  <line x1="312" y1="120" x2="340" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-h-simple)" />
  <line x1="627" y1="120" x2="655" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-h-simple)" />
  <line x1="942" y1="120" x2="970" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-h-simple)" />

  <!-- ==================== CARD 1: INPUT ==================== -->
  <g transform="translate(30, 25)" filter="url(#shadow-h-simple)">
    <rect width="280" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 266 0 Q 280 0 280 14 L 280 8 L 0 8 Z" fill="#475569" />
    
    <rect x="20" y="20" width="55" height="22" rx="11" fill="#f1f5f9" />
    <text x="47" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">INPUT</text>
    
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LLM Answer &amp;</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Source Documents</text>
    
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Generated Answer</text>
    <text x="28" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Prose, lists, or tables</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Matched Documents</text>
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Indexed EEA reports &amp; sites</text>
  </g>

  <!-- ==================== CARD 2: EXTRACTION ==================== -->
  <g transform="translate(345, 25)" filter="url(#shadow-h-simple)">
    <rect width="280" height="190" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 266 0 Q 280 0 280 14 L 280 8 L 0 8 Z" fill="#4f46e5" />
    
    <rect x="20" y="20" width="55" height="22" rx="11" fill="#eef2ff" />
    <text x="47" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">STEP 1</text>
    
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LLM-Based Claim</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Extraction</text>
    
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Multiple Claims (1..N)</text>
    <text x="28" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Extracts atomic statements</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Table-Aware</text>
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Preserves full table context</text>
  </g>

  <!-- ==================== CARD 3: LLM JUDGE ==================== -->
  <g transform="translate(660, 25)" filter="url(#shadow-h-simple)">
    <rect width="280" height="190" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 266 0 Q 280 0 280 14 L 280 8 L 0 8 Z" fill="#7c3aed" />
    
    <rect x="20" y="20" width="55" height="22" rx="11" fill="#f5f3ff" />
    <text x="47" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">STEP 2</text>
    
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LLM Judge</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Cross-Matching</text>
    
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Crossmatch to Sources</text>
    <text x="28" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Checks claims against docs</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7c3aed">• Judge Verdict</text>
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Supported / Contra / Unverified</text>
  </g>

  <!-- ==================== CARD 4: AUDIT REPORT ==================== -->
  <g transform="translate(975, 25)" filter="url(#shadow-h-simple)">
    <rect width="275" height="190" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 261 0 Q 275 0 275 14 L 275 8 L 0 8 Z" fill="#059669" />
    
    <rect x="20" y="20" width="55" height="22" rx="11" fill="#ecfdf5" />
    <text x="47" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">OUTPUT</text>
    
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Verification &amp;</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Hallucination Report</text>
    
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">• Grounded Verdicts</text>
    <text x="28" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">With verbatim source quotes</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">• Hallucination Flags</text>
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Identifies ungrounded claims</text>
  </g>
</svg>
