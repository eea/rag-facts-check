<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380">
  <defs>
    <filter id="shadow-simple" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
    <marker id="arrow-down-simple" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-right-simple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1060" height="380" rx="16" fill="#f8fafc" />

  <!-- Connecting Arrows -->
  <line x1="270" y1="170" x2="270" y2="198" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-down-simple)" />
  <line x1="790" y1="170" x2="790" y2="198" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-down-simple)" />

  <!-- Smooth connecting path from Card 2 to Card 3 -->
  <path d="M 510 275 L 530 275 Q 535 275 535 265 L 535 105 Q 535 95 540 95 L 546 95" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-right-simple)" />

  <!-- ==================== LEFT COLUMN ==================== -->

  <!-- CARD 1: INPUT -->
  <g transform="translate(30, 25)" filter="url(#shadow-simple)">
    <rect width="480" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 12 0 L 12 145 L 0 145 Q 0 145 0 131 Z" fill="#475569" />
    
    <rect x="25" y="20" width="55" height="22" rx="11" fill="#f1f5f9" />
    <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">INPUT</text>
    
    <text x="92" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM Answer &amp; Source Documents</text>
    
    <text x="25" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Generated Answer: <tspan font-weight="400" fill="#475569">Prose, bullet lists, or comparison tables</tspan></text>
    <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Matched Documents: <tspan font-weight="400" fill="#475569">Indexed EEA websites, reports &amp; briefings</tspan></text>
  </g>

  <!-- CARD 2: EXTRACTION -->
  <g transform="translate(30, 205)" filter="url(#shadow-simple)">
    <rect width="480" height="145" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 12 0 L 12 145 L 0 145 Q 0 145 0 131 Z" fill="#4f46e5" />
    
    <rect x="25" y="20" width="55" height="22" rx="11" fill="#eef2ff" />
    <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">STEP 1</text>
    
    <text x="92" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM-Based Claim Extraction</text>
    
    <text x="25" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Multiple Claims (1..N): <tspan font-weight="400" fill="#475569">Extracts atomic statements from answer</tspan></text>
    <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Full Coverage: <tspan font-weight="400" fill="#475569">Preserves context across tables and long responses</tspan></text>
  </g>

  <!-- ==================== RIGHT COLUMN ==================== -->

  <!-- CARD 3: LLM JUDGE -->
  <g transform="translate(550, 25)" filter="url(#shadow-simple)">
    <rect width="480" height="145" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 12 0 L 12 145 L 0 145 Q 0 145 0 131 Z" fill="#7c3aed" />
    
    <rect x="25" y="20" width="55" height="22" rx="11" fill="#f5f3ff" />
    <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">STEP 2</text>
    
    <text x="92" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM Judge Cross-Matching</text>
    
    <text x="25" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Crossmatch to Documents: <tspan font-weight="400" fill="#475569">Checks each claim against matched text</tspan></text>
    <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Judge Question: <tspan font-weight="600" fill="#7c3aed">Supported, Contradicted, or Not Enough Info?</tspan></text>
  </g>

  <!-- CARD 4: AUDIT REPORT -->
  <g transform="translate(550, 205)" filter="url(#shadow-simple)">
    <rect width="480" height="145" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <path d="M 0 14 Q 0 0 14 0 L 12 0 L 12 145 L 0 145 Q 0 145 0 131 Z" fill="#059669" />
    
    <rect x="25" y="20" width="55" height="22" rx="11" fill="#ecfdf5" />
    <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">OUTPUT</text>
    
    <text x="92" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Verification &amp; Hallucination Report</text>
    
    <text x="25" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Per-Claim Verdicts: <tspan font-weight="400" fill="#475569">Grounded statements with verbatim source quotes</tspan></text>
    <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">• Hallucination Detection: <tspan font-weight="400" fill="#475569">Flags unsupported or contradicted assertions</tspan></text>
  </g>
</svg>
