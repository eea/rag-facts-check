<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="500" height="680">
  <defs>
    <filter id="shadow-v" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="500" height="680" rx="16" fill="#f8fafc" />

  <!-- Vertical connecting arrows -->
  <line x1="250" y1="115" x2="250" y2="140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-v)" />
  <line x1="250" y1="245" x2="250" y2="270" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-v)" />
  <line x1="250" y1="375" x2="250" y2="400" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-v)" />
  <line x1="250" y1="505" x2="250" y2="530" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-v)" />

  <!-- ==================== CARD 1: INPUT ==================== -->
  <g transform="translate(30, 20)" filter="url(#shadow-v)">
    <rect width="440" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 95 L 0 95 Q 0 95 0 83 Z" fill="#64748b" />
    
    <rect x="25" y="16" width="55" height="20" rx="10" fill="#f1f5f9" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">INPUT</text>
    
    <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Answer &amp; Source Documents</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Generated markdown answer (prose &amp; tables)</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Official European environmental briefings &amp; legislation</text>
  </g>

  <!-- ==================== CARD 2: EXTRACTION ==================== -->
  <g transform="translate(30, 150)" filter="url(#shadow-v)">
    <rect width="440" height="95" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 95 L 0 95 Q 0 95 0 83 Z" fill="#4f46e5" />
    
    <rect x="25" y="16" width="55" height="20" rx="10" fill="#eef2ff" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4f46e5" text-anchor="middle">STEP 1</text>
    
    <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Chunked Claim Extraction</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Table-Aware: Replicates header rows into each chunk</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Deduplicates identical claim spans across boundaries</text>
  </g>

  <!-- ==================== CARD 3: VERIFICATION ==================== -->
  <g transform="translate(30, 280)" filter="url(#shadow-v)">
    <rect width="440" height="95" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 95 L 0 95 Q 0 95 0 83 Z" fill="#7c3aed" />
    
    <rect x="25" y="16" width="55" height="20" rx="10" fill="#f5f3ff" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">STEP 2</text>
    
    <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">KV-Cache Batch Verification</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Batches 20 claims at once (cuts latency from 50s to 5–12s)</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Static prompt prefix reuses pre-computed KV cache</text>
  </g>

  <!-- ==================== CARD 4: EVIDENCE ==================== -->
  <g transform="translate(30, 410)" filter="url(#shadow-v)">
    <rect width="440" height="95" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 95 L 0 95 Q 0 95 0 83 Z" fill="#0d9488" />
    
    <rect x="25" y="16" width="55" height="20" rx="10" fill="#f0fdfa" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle">STEP 3</text>
    
    <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Resilient Evidence Locator</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• 4-stage hierarchy: quote strip → exact → regex → fuzzy</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Resolves exact {start, end} despite PDF line breaks</text>
  </g>

  <!-- ==================== CARD 5: OUTPUT ==================== -->
  <g transform="translate(30, 540)" filter="url(#shadow-v)">
    <rect width="440" height="95" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 95 L 0 95 Q 0 95 0 83 Z" fill="#059669" />
    
    <rect x="25" y="16" width="55" height="20" rx="10" fill="#ecfdf5" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">OUTPUT</text>
    
    <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">0–10 Trust Score &amp; UI Highlights</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">• Calibrated score badge (e.g., 8.5/10 Good) in Volto</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#059669">• 🟢 Verified claims + hover tooltips | 🟡 Low | 🔴 Contra</text>
  </g>
</svg>
